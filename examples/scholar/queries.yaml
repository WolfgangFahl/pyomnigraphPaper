# named parameterized queries for the scholarly use case
# see https://github.com/WolfgangFahl/pyLoDStorage
'AuthorPapers':
  # the papers of an author identified by dblp person id (pid)
  param_list:
    - name: author_dblpid
      type: str
      default_value: 27/6858 # Wolfgang Fahl
    - name: limit
      type: int
      default_value: 10
  sparql: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    SELECT ?pub ?title ?year ?venue WHERE {
      ?pub dblp:authoredBy <https://dblp.org/pid/{{ author_dblpid }}> ;
           dblp:title ?title ;
           dblp:yearOfPublication ?year .
      OPTIONAL { ?pub dblp:publishedIn ?venue }
    }
    ORDER BY DESC(?year)
    LIMIT {{ limit }}
'CoauthorPapers':
  # the papers of all coauthors of a given paper identified by dblp record id
  param_list:
    - name: paper_dblpid
      type: str
      default_value: conf/semweb/FahlHW0D22a # Getting and hosting your own copy of Wikidata
    - name: limit
      type: int
      default_value: 10
  sparql: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    SELECT ?author ?author_name ?pub ?title ?year WHERE {
      <https://dblp.org/rec/{{ paper_dblpid }}> dblp:authoredBy ?author .
      ?author dblp:primaryCreatorName ?author_name .
      ?pub dblp:authoredBy ?author ;
           dblp:title ?title ;
           dblp:yearOfPublication ?year .
    }
    ORDER BY ?author_name DESC(?year)
    LIMIT {{ limit }}
'EventAuthorPapers':
  # the papers of all authors of a given scientific event identified by Wikidata QID
  # runs on the full Wikidata graph at qlever.dev - the WDQS graph split separates
  # event/proceedings (main) from papers/authors (scholarly)
  param_list:
    - name: event_qid
      type: str
      default_value: Q116982157 # TEXT2KG 2023
    - name: limit
      type: int
      default_value: 10
  sparql: |
    # label handling per scholia author_list-of-publications.sparql:
    # authors without an english label fall back to their QID instead of being dropped
    PREFIX wdt: <http://www.wikidata.org/prop/direct/>
    PREFIX wd: <http://www.wikidata.org/entity/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?author ?author_name ?pub ?title ?year WHERE {
      ?proceedings wdt:P4745 wd:{{ event_qid }} .
      ?event_paper wdt:P1433 ?proceedings ;
                   wdt:P50 ?author .
      OPTIONAL {
        ?author rdfs:label ?author_label .
        FILTER(LANG(?author_label) = "en")
      }
      BIND(COALESCE(?author_label, SUBSTR(STR(?author), 32)) AS ?author_name)
      ?pub wdt:P50 ?author ;
           wdt:P1476 ?title .
      OPTIONAL { ?pub wdt:P577 ?date . }
      BIND(YEAR(?date) AS ?year)
    }
    ORDER BY ?author_name DESC(?year)
    LIMIT {{ limit }}
