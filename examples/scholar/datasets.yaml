# npq subgraph datasets for the scholarly use case
# see https://github.com/WolfgangFahl/pyomnigraphPaper/issues/10
datasets:
  author_papers_dblp:
    # subgraph of an author: the author node and all papers authored
    # derived from the AuthorPapers query of
    # https://github.com/WolfgangFahl/pyomnigraphPaper/issues/4
    name: "Author papers (dblp)"
    base_url: "https://qlever.dev/dblp"
    endpoint_url: "https://qlever.dev/api/dblp"
    database: "qlever"
    expected_solutions: 204
    params:
      authors: "<https://dblp.org/pid/27/6858>"
    select_pattern: |
      {
        VALUES ?s { {{ authors }} }
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?author { {{ authors }} }
        ?s <https://dblp.org/rdf/schema#authoredBy> ?author .
        ?s ?p ?o .
      }
    construct_template: "?s ?p ?o"
    description: "Author node and all papers of the authors given by the dblp pid seed, dblp graph via qlever.dev"
    active: true
  coauthor_papers_dblp:
    # subgraph of a paper: the paper node, its authors and all their papers
    # derived from the CoauthorPapers query of
    # https://github.com/WolfgangFahl/pyomnigraphPaper/issues/5
    name: "Coauthor papers (dblp)"
    base_url: "https://qlever.dev/dblp"
    endpoint_url: "https://qlever.dev/api/dblp"
    database: "qlever"
    expected_solutions: 22524
    params:
      papers: "<https://dblp.org/rec/conf/semweb/FahlHW0D22a>"
    select_pattern: |
      {
        VALUES ?s { {{ papers }} }
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?paper { {{ papers }} }
        ?paper <https://dblp.org/rdf/schema#authoredBy> ?s .
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?paper { {{ papers }} }
        ?paper <https://dblp.org/rdf/schema#authoredBy> ?author .
        ?s <https://dblp.org/rdf/schema#authoredBy> ?author .
        ?s ?p ?o .
      }
    construct_template: "?s ?p ?o"
    description: "Paper node, its authors and all papers of these authors given by the dblp record seed, dblp graph via qlever.dev"
    active: true
  event_author_papers_wikidata:
    # subgraph of a scientific event: the event node, its proceedings,
    # the event papers, their authors and all papers of these authors
    # derived from the EventAuthorPapers query of
    # https://github.com/WolfgangFahl/pyomnigraphPaper/issues/7
    name: "Event author papers (wikidata)"
    base_url: "https://qlever.dev/wikidata"
    endpoint_url: "https://qlever.dev/api/wikidata"
    database: "qlever"
    expected_solutions: 19107
    params:
      events: "<http://www.wikidata.org/entity/Q133307039>"
    select_pattern: |
      {
        VALUES ?s { {{ events }} }
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?event { {{ events }} }
        ?s <http://www.wikidata.org/prop/direct/P4745> ?event .
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?event { {{ events }} }
        ?proceedings <http://www.wikidata.org/prop/direct/P4745> ?event .
        ?s <http://www.wikidata.org/prop/direct/P1433> ?proceedings .
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?event { {{ events }} }
        ?proceedings <http://www.wikidata.org/prop/direct/P4745> ?event .
        ?event_paper <http://www.wikidata.org/prop/direct/P1433> ?proceedings .
        ?event_paper <http://www.wikidata.org/prop/direct/P50> ?s .
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?event { {{ events }} }
        ?proceedings <http://www.wikidata.org/prop/direct/P4745> ?event .
        ?event_paper <http://www.wikidata.org/prop/direct/P1433> ?proceedings .
        ?event_paper <http://www.wikidata.org/prop/direct/P50> ?author .
        ?s <http://www.wikidata.org/prop/direct/P50> ?author .
        ?s ?p ?o .
      }
    construct_template: "?s ?p ?o"
    description: "Event node, proceedings, event papers, their authors and all papers of these authors given by the event seed, Wikidata graph via qlever.dev"
    active: true
  institution_author_papers_gnd:
    # subgraph of an institution: the institution node, its affiliated
    # authors and their work records
    # derived from the InstitutionAuthorPapers query of
    # https://github.com/WolfgangFahl/pyomnigraphPaper/issues/9
    name: "Institution author papers (gnd)"
    base_url: "https://sparql.dnb.de"
    endpoint_url: "https://sparql.dnb.de/api/gnd"
    database: "qlever"
    expected_solutions: 30833
    params:
      institutions: "<https://d-nb.info/gnd/36225-6>"
    select_pattern: |
      {
        VALUES ?s { {{ institutions }} }
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?institution { {{ institutions }} }
        ?s <https://d-nb.info/standards/elementset/gnd#affiliation> ?institution .
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?institution { {{ institutions }} }
        ?author <https://d-nb.info/standards/elementset/gnd#affiliation> ?institution .
        ?s <https://d-nb.info/standards/elementset/gnd#firstAuthor> ?author .
        ?s ?p ?o .
      }
      UNION
      {
        VALUES ?institution { {{ institutions }} }
        ?author <https://d-nb.info/standards/elementset/gnd#affiliation> ?institution .
        ?s <https://d-nb.info/standards/elementset/gnd#author> ?author .
        ?s ?p ?o .
      }
    construct_template: "?s ?p ?o"
    description: "Institution node, affiliated authors and their work records given by the gnd id seed, GND graph via the DNB SPARQL service"
    active: true
