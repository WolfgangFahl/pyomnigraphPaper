'LineIdentity':
  # railway use case: Wikidata + OSM + ERA RINF, linking elements P402 / P1671
  # leg idioms per examples/railway/queries.yaml; the linking elements are
  # enforced as cross-leg join filters after the legs return
  # service legs are late-bound parameters; defaults are the public origins
  param_list:
    - name: wikidata_id
      type: str
      default_value: Q801991 # Bordeaux-Irun railway
    - name: osm_relation_id
      type: int
      default_value: 1852360 # P402 of Q801991
    - name: rinf_line_id
      type: str
      default_value: 655000-1 # RINF lineId, P1671 of Q801991 plus track suffix
    - name: wikidata_service
      type: str
      default_value: https://qlever.dev/api/wikidata
    - name: osm_service
      type: str
      default_value: https://qlever.dev/api/osm-planet
    - name: rinf_service
      type: str
      default_value: https://rinf.data.era.europa.eu/api/sparql
  sparql: |
    PREFIX wdt: <http://www.wikidata.org/prop/direct/>
    PREFIX wd: <http://www.wikidata.org/entity/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX osmkey: <https://www.openstreetmap.org/wiki/Key:>
    PREFIX osmrel: <https://www.openstreetmap.org/relation/>
    PREFIX era: <http://data.europa.eu/949/>
    SELECT ?line ?line_name ?osm_relation ?osm_name ?line_number ?rinf_lps ?rinf_lid
    WHERE {
      SERVICE <{{ wikidata_service }}> {
        VALUES ?line { wd:{{ wikidata_id }} }
        ?line wdt:P402 ?osm_relation ;
              wdt:P1671 ?line_number ;
              rdfs:label ?line_name .
        FILTER(LANG(?line_name) = "en")
      }
      SERVICE <{{ osm_service }}> {
        VALUES ?osm_rel { osmrel:{{ osm_relation_id }} }
        ?osm_rel osmkey:ref ?osm_ref ;
                 osmkey:name ?osm_name .
      }
      SERVICE <{{ rinf_service }}> {
        ?rinf_lps a era:LinearPositioningSystem ;
                  era:lineId ?rinf_lid .
        FILTER(STR(?rinf_lid) = "{{ rinf_line_id }}")
      }
      # P402 joins the Wikidata leg to the OSM leg
      FILTER(STR(?osm_relation) = "{{ osm_relation_id }}")
      FILTER(?osm_ref = ?line_number)
      # P1671 joins the Wikidata leg to the RINF leg (lineId adds a track suffix)
      FILTER(STRSTARTS(STR(?rinf_lid), REPLACE(?line_number, " ", "")))
    }
