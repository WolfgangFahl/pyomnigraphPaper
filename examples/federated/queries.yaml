# named parameterized three-leg federated queries
# see https://github.com/WolfgangFahl/pyomnigraphPaper/issues/24
'AuthorIdentity':
  # scholarly use case: dblp + GND + Wikidata, linking element ORCID
  # service legs are late-bound parameters; defaults are the public origins
  param_list:
    - name: orcid
      type: str
      default_value: 0000-0001-6324-7164 # Stefan Decker
    - name: dblp_service
      type: str
      default_value: https://qlever.dev/api/dblp
    - name: gnd_service
      type: str
      default_value: https://sparql.dnb.de/api/gnd
    - name: wikidata_service
      type: str
      default_value: https://qlever.dev/api/wikidata
  sparql: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX gndo: <https://d-nb.info/standards/elementset/gnd#>
    PREFIX owl: <http://www.w3.org/2002/07/owl#>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX wdt: <http://www.wikidata.org/prop/direct/>
    SELECT ?dblp_person ?dblp_name ?gnd_person ?gnd_name ?wd_person ?wd_name
    WHERE {
      SERVICE <{{ dblp_service }}> {
        ?dblp_person dblp:orcid <https://orcid.org/{{ orcid }}> ;
                     rdfs:label ?dblp_name .
      }
      SERVICE <{{ gnd_service }}> {
        ?gnd_person owl:sameAs <https://orcid.org/{{ orcid }}> ;
                    gndo:preferredNameForThePerson ?gnd_name .
      }
      SERVICE <{{ wikidata_service }}> {
        ?wd_person wdt:P496 "{{ orcid }}" ;
                   rdfs:label ?wd_name .
        FILTER(LANG(?wd_name) = "en")
      }
    }
'PlaceIdentity':
  # locations use case: GOV + FactGrid + Wikidata, linking element GOV id
  # leg idioms per examples/locations/queries.yaml: GOV place IRI,
  # FactGrid fgt:P1073, Wikidata wdt:P2503
  # service legs are late-bound parameters; defaults are the public origins
  param_list:
    - name: gov_id
      type: str
      default_value: AACHENJO30BS # Aachen
    - name: gov_service
      type: str
      default_value: https://gov-sparql.genealogy.net/dataset/sparql
    - name: factgrid_service
      type: str
      default_value: https://database.factgrid.de/sparql
    - name: wikidata_service
      type: str
      default_value: https://qlever.dev/api/wikidata
  sparql: |
    PREFIX gp: <http://gov.genealogy.net/ontology.owl#>
    PREFIX gov: <http://gov.genealogy.net/>
    PREFIX fgt: <https://database.factgrid.de/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX wdt: <http://www.wikidata.org/prop/direct/>
    SELECT ?gov_name ?fg_place ?fg_name ?wd_place ?wd_name
    WHERE {
      SERVICE <{{ gov_service }}> {
        gov:{{ gov_id }} gp:hasName/gp:value ?gov_name .
      }
      SERVICE <{{ factgrid_service }}> {
        ?fg_place fgt:P1073 "{{ gov_id }}" ;
                  rdfs:label ?fg_name .
        FILTER(LANG(?fg_name) = "de")
      }
      SERVICE <{{ wikidata_service }}> {
        ?wd_place wdt:P2503 "{{ gov_id }}" ;
                  rdfs:label ?wd_name .
        FILTER(LANG(?wd_name) = "en")
      }
    }
